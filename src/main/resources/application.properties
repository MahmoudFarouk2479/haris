spring.application.name=haris
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# Loopback only, on a random free port chosen at every launch.
# Nothing on the LAN can reach this server, and nothing ever touches the firewall.
server.address=127.0.0.1
server.port=0

# Never leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

logging.level.root=WARN
logging.level.dev.haris=INFO
# The installed app has no console: keep a small rolling log for troubleshooting.
# It records start-up, engine and error events — never conversation text, file contents or keys.
logging.file.name=${user.home}/.haris/logs/haris.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3

# Open the HUD in a dedicated, isolated browser window on startup,
# and shut the core down when that window is closed.
haris.open-window=true
haris.exit-on-window-close=true
