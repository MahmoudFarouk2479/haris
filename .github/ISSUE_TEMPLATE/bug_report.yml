name: Bug report
description: Something doesn't work as the guides say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go through a private advisory instead** (see SECURITY.md).
        Never paste API keys, tokens or the address bar of the Haris window.
  - type: input
    id: version
    attributes:
      label: Haris version
      description: From the zip you installed, for example Haris-0.6.0-windows.zip means 0.6.0.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Claude
        - Ollama (local)
        - LM Studio (local)
        - OpenAI-compatible
        - Ollama on Google Colab
        - Not set up yet
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "qwen3:8b, claude-opus-5-5 …"
  - type: dropdown
    id: docker
    attributes:
      label: Docker Desktop running?
      options: ["Yes", "No", "Don't know"]
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: NVIDIA GPU?
      options: ["Yes", "No", "Don't know"]
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: ["English", "Arabic"]
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: From %USERPROFILE%\.haris\logs\haris.log (it never contains conversation text or keys). Paste only the lines around the problem.
      render: text
